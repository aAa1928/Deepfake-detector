[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-audio-detector"
version = "0.1.0"
description = "Scaffold for AI-generated and voice-clone audio detection"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Your Name" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
